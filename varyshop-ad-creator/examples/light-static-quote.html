<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Static 1 — Citátový</title>
<link rel="stylesheet" href="../assets/css/brand.css">
<style>
.slide { background: var(--vs-white); padding: 90px 80px 80px; }

.eyebrow-tag {
  display: inline-block;
  background: var(--vs-blue);
  color: var(--vs-white);
  padding: 12px 24px;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-radius: 4px;
  margin-bottom: 50px;
}

.quote-mark {
  font-family: 'Inter Tight', sans-serif;
  font-size: 200px;
  line-height: 0.4;
  color: var(--vs-blue);
  font-weight: 900;
  margin-bottom: 30px;
}

.quote-text {
  font-family: 'Inter Tight', sans-serif;
  font-weight: 900;
  font-size: 76px;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--vs-black);
  margin-bottom: 50px;
}
.quote-text .blue { color: var(--vs-blue); }

.attribution {
  border-top: 1px solid var(--vs-light-gray);
  padding-top: 24px;
  font-family: 'Inter', sans-serif;
  font-style: italic;
  font-weight: 600;
  font-size: 22px;
  color: var(--vs-blue);
}
</style>
</head>
<body>
<div class="slide">
  <div class="x-line lg" style="top: 200px; right: 90px;"></div>
  <div class="x-line dim" style="bottom: 280px; right: 70px;"></div>
  <div class="x-line sm faint" style="top: 60%; left: 50px;"></div>

  <div class="content-layer">
    <div class="vs-top">
      <div class="vs-brand">VARYSHOP<span class="blue-dot">.</span></div>
      <div class="vs-counter">CITÁT</div>
    </div>

    <div class="eyebrow-tag">CHAOS V FIRMĚ</div>

    <div class="quote-mark">"</div>

    <div class="quote-text">
      Zapisování.<br>
      Přepisování.<br>
      Přeposílání.<br><br>
      To je <span class="blue">nenasytná bestie</span>,<br>
      která <span class="blue">žere čas.</span>
    </div>

    <div class="attribution">— Varyshop · z chaosu v systém</div>
  </div>

  <div class="vs-bottom">
    <div class="vs-url">varyshop<span class="blue">.eu</span></div>
    <div class="vs-swipe">vaše překážky · naše parketa</div>
  </div>
</div>
</body>
</html>
