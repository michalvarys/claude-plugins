<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<title>Varyshop dark ad — example</title>
<link rel="stylesheet" href="../assets/css/brand-dark.css">
<style>
  body { width:1080px; height:1080px; }
  .ad { width:1080px; height:1080px; padding:80px 88px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .headline-dark { font-size:112px; }
  .pains { display:flex; flex-direction:column; gap:14px; margin-top:40px; }
  .foot { display:flex; align-items:flex-end; justify-content:space-between; }
  .foot .body-dark .headline-dark { font-size:32px; }
</style>
</head>
<body>
<div class="ad">
  <div class="ad-glow-blue"  style="top:-200px; right:-200px; width:600px; height:600px;"></div>
  <div class="ad-glow-yellow" style="bottom:-300px; left:-200px; width:700px; height:700px;"></div>
  <span class="x-mark-dark lg" style="top:80px; left:88px;"></span>

  <div class="top">
    <div class="vs-brand-dark">VARYSHOP<span class="dot"></span></div>
    <div class="eyebrow-tag-dark">AI WORKFLOWS · JAKO SLUŽBA</div>
  </div>

  <div>
    <div class="headline-dark">Postavíte<br><span class="em">pipeline.</span></div>
    <div class="pains">
      <div class="pain-dark"><div class="num">1</div><div class="txt">Neznáte <strong>konverzi</strong> ani <span class="blue">cenu zákazníka</span> — měříte naslepo.</div></div>
      <div class="pain-dark"><div class="num">2</div><div class="txt">Něco změníte a <strong>modlíte se</strong>, ať to nerozbije zbytek.</div></div>
    </div>
  </div>

  <div class="foot">
    <div class="body-dark">Místo dalšího FTE<br><span class="headline-dark"><span class="acc">24/7. Bez chyb.</span></span></div>
    <div class="cta-dark">varyshop<span class="acc">.eu</span></div>
  </div>
</div>
</body>
</html>
